[package]
name = "leagueaccounts-app"
version = "1.0.0"
edition = "2021"
description = "MORPH WRLD personal Riot and Steam account vault for Windows"
license = "MIT"
publish = false

[[bin]]
name = "MorphWrldRiftVault"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3.6"
leagueaccounts = { path = ".." }
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
